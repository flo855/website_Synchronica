<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shows - Team Synchronica</title>
    <style>
      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        background: #000;
        color: #fff;
        font-family: Arial, sans-serif;
      }

      main {
        width: min(1100px, calc(100% - 40px));
        margin: 0 auto;
        padding: 60px 0;
      }

      .back {
        display: inline-block;
        margin-bottom: 36px;
        color: #fff;
        text-decoration: none;
      }

      h1 {
        margin: 0 0 24px;
        font-size: clamp(2.5rem, 7vw, 5.5rem);
      }

      .show {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(220px, 1fr);
        gap: 32px;
        align-items: start;
      }

      .video-area {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-radius: 10px;
        background: #000;
      }

      .video-area img,
      .video-area iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }

      .video-area img {
        display: block;
        object-fit: cover;
      }

      .play-button {
        position: absolute;
        inset: 50% auto auto 50%;
        width: 84px;
        height: 84px;
        transform: translate(-50%, -50%);
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
        color: #1565c0;
        cursor: pointer;
        font-size: 34px;
        line-height: 84px;
        text-align: center;
        text-indent: 6px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      }

      .play-button:hover,
      .play-button:focus-visible {
        background: #fff;
        transform: translate(-50%, -50%) scale(1.05);
      }

      .stats h2 {
        margin: 0 0 18px;
        font-size: clamp(2rem, 5vw, 3.5rem);
      }

      .stats ul {
        margin: 0;
        padding-left: 24px;
        font-size: clamp(1.1rem, 2.5vw, 1.35rem);
        line-height: 1.7;
      }

      @media (max-width: 760px) {
        main {
          padding-top: 32px;
        }

        .show {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="index.html">Zurück zur Startseite</a>
      <h1>Squared Lights</h1>
      <div class="show">
        <div class="video-area" id="video-area">
          <img src="Squared_Lights.jpeg" alt="Squared Lights" />
          <button class="play-button" id="play-button" type="button" aria-label="Squared Lights Video abspielen">▶</button>
        </div>
        <aside class="stats">
          <h2>Stats</h2>
          <ul>
            <li>Länge: 5 Minuten</li>
            <li>Showfarben individualisierbar</li>
            <li>Logopainting verfügbar</li>
          </ul>
        </aside>
      </div>
    </main>
    <script>
      document.getElementById("play-button").addEventListener("click", function () {
        var videoArea = document.getElementById("video-area");
        videoArea.innerHTML =
          '<iframe src="https://www.youtube-nocookie.com/embed/cZunRCSPVKQ?autoplay=1" title="Squared Lights" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>';
      });
    </script>
  </body>
</html>
