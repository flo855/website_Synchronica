<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media - Team Synchronica</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        background: #000;
        color: #fff;
        font-family: Arial, sans-serif;
      }

      .menu {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 10;
      }

      .menu summary {
        width: 44px;
        height: 44px;
        display: grid;
        place-content: center;
        gap: 6px;
        cursor: pointer;
        list-style: none;
      }

      .menu summary::-webkit-details-marker {
        display: none;
      }

      .menu summary::before,
      .menu summary span,
      .menu summary::after {
        content: "";
        width: 30px;
        height: 3px;
        display: block;
        background: #fff;
        border-radius: 2px;
      }

      .menu nav {
        position: absolute;
        top: 52px;
        right: 0;
        min-width: 180px;
        padding: 8px;
        background: #111;
        border: 1px solid #333;
        border-radius: 8px;
      }

      .menu a {
        display: block;
        padding: 12px 14px;
        border-radius: 5px;
        color: #fff;
        text-decoration: none;
      }

      .menu a:hover,
      .menu a:focus-visible {
        background: #333;
      }

      main {
        width: min(1200px, calc(100% - 40px));
        margin: 0 auto;
        padding: 88px 0 48px;
      }

      h1 {
        margin: 0 0 32px;
        font-size: clamp(2.5rem, 8vw, 5rem);
        text-align: center;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 18px;
      }

      .placeholder {
        display: grid;
        aspect-ratio: 1;
        place-items: center;
        border: 1px dashed #555;
        border-radius: 10px;
        background: #101010;
        color: #888;
        font-size: 1rem;
      }

      .back {
        position: fixed;
        top: 24px;
        left: 24px;
        padding: 10px 14px;
        border: 1px solid #fff;
        border-radius: 6px;
        color: #fff;
        text-decoration: none;
      }

      .back:hover,
      .back:focus-visible {
        background: #fff;
        color: #000;
      }

      @media (max-width: 900px) {
        .gallery {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 600px) {
        .gallery {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 12px;
        }
      }
    </style>
  </head>
  <body>
    <details class="menu">
      <summary aria-label="Menü öffnen">
        <span></span>
      </summary>
      <nav aria-label="Hauptmenü">
        <a href="index.html">Startseite</a>
        <a href="team.html">Team</a>
        <a href="shows.html">Shows</a>
        <a href="media.html">Media</a>
        <a href="contact.html">Contact</a>
      </nav>
    </details>
    <a class="back" href="index.html">Zurück zur Startseite</a>
    <main>
      <h1>Media</h1>
      <div class="gallery" aria-label="Platzhalter für zukünftige Bilder">
        <div class="placeholder">Bild folgt</div>
        <div class="placeholder">Bild folgt</div>
        <div class="placeholder">Bild folgt</div>
        <div class="placeholder">Bild folgt</div>
        <div class="placeholder">Bild folgt</div>
        <div class="placeholder">Bild folgt</div>
        <div class="placeholder">Bild folgt</div>
        <div class="placeholder">Bild folgt</div>
        <div class="placeholder">Bild folgt</div>
        <div class="placeholder">Bild folgt</div>
        <div class="placeholder">Bild folgt</div>
        <div class="placeholder">Bild folgt</div>
      </div>
    </main>
  </body>
</html>
