<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team - Team Synchronica</title>
    <style>
      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #000;
        color: #fff;
        font-family: Arial, sans-serif;
      }

      main {
        text-align: center;
      }

      h1 {
        margin: 0 0 24px;
        font-size: clamp(3rem, 10vw, 7rem);
      }

      .back {
        position: fixed;
        top: 24px;
        left: 24px;
        padding: 10px 14px;
        border: 1px solid #fff;
        border-radius: 6px;
        color: #fff;
        text-decoration: none;
      }

      .back:hover,
      .back:focus-visible {
        background: #fff;
        color: #000;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Team</h1>
      <a class="back" href="index.html">Zurück zur Startseite</a>
    </main>
  </body>
</html>
