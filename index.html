<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Synchronica</title>
    <style>
      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #000;
        color: #fff;
      }

      .menu {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 10;
      }

      .menu summary {
        width: 44px;
        height: 44px;
        display: grid;
        place-content: center;
        gap: 6px;
        cursor: pointer;
        list-style: none;
      }

      .menu summary::-webkit-details-marker {
        display: none;
      }

      .menu summary::before {
        content: "";
      }

      .menu summary span,
      .menu summary::before,
      .menu summary::after {
        content: "";
        width: 30px;
        height: 3px;
        display: block;
        background: #fff;
        border-radius: 2px;
      }

      .menu nav {
        position: absolute;
        top: 52px;
        right: 0;
        min-width: 180px;
        padding: 8px;
        background: #111;
        border: 1px solid #333;
        border-radius: 8px;
      }

      .menu a {
        display: block;
        padding: 12px 14px;
        color: #fff;
        font-family: Arial, sans-serif;
        text-decoration: none;
        border-radius: 5px;
      }

      .menu a:hover,
      .menu a:focus-visible {
        background: #333;
      }

      .logo {
        position: fixed;
        top: 24px;
        left: 24px;
        width: min(34vw, 280px);
        max-height: 120px;
        object-fit: contain;
        margin: 0;
      }

      .contact {
        position: fixed;
        top: 154px;
        left: 24px;
        padding: 10px 18px;
        border: 1px solid #fff;
        border-radius: 6px;
        background: #000;
        color: #fff;
        font-family: Arial, sans-serif;
        text-decoration: none;
      }

      .contact:hover,
      .contact:focus-visible {
        background: #fff;
        color: #000;
      }
    </style>
  </head>
  <body>
    <details class="menu">
      <summary aria-label="Menü öffnen">
        <span></span>
      </summary>
      <nav aria-label="Hauptmenü">
        <a href="team.html">Team</a>
        <a href="shows.html">Shows</a>
        <a href="media.html">Media</a>
      </nav>
    </details>
    <img class="logo" src="LOGO_Original_colours.png" alt="Team Synchronica" />
    <a class="contact" href="mailto:synchronica.show@gmail.com">Contact</a>
  </body>
</html>
